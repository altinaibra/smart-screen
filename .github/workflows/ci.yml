name: CI

on:
  push:
    branches: [dev, main, master, 'feature/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build backend/SmartScreen.sln -p:SkipFrontend=true
      - name: Tests
        run: dotnet test backend/SmartScreen.sln -p:SkipFrontend=true --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Player syntax check
        run: node -e "require('vm').createScript(require('fs').readFileSync('../backend/SmartScreen.Api/wwwroot/player/player.js','utf8'))"
