<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Smart Screen Player</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div id="root">
    <div id="header" class="hidden">
      <div class="h-brand">
        <div id="hLogo" class="logo-circle"></div>
        <div id="hName" class="h-name"></div>
        <div id="hTagline" class="h-tagline"></div>
      </div>
      <div class="h-right">
        <div id="progress" class="progress"></div>
        <div id="hStatus" class="h-status hidden"><span id="hDot" class="dot"></span><span id="hStatusText"></span></div>
        <div id="clock" class="h-clock hidden"></div>
      </div>
    </div>
    <div id="slides">
      <div class="layer" id="layerA"></div>
      <div class="layer" id="layerB"></div>
    </div>
    <div id="ticker" class="hidden"><div class="ticker-track" id="tickerTrack"></div></div>
    <div id="overlay" class="hidden"></div>
    <div id="netStatus" class="hidden"></div>
  </div>
  <script src="player.js"></script>
</body>
</html>
