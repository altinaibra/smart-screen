<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <title>Smart Screen</title>
  <style>
    html, body { margin: 0; height: 100%; background: #121419; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; }
    .logo { width: 88px; height: 88px; border-radius: 20px; background: #c8102e; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; color: #ffc72c; }
    .spinner { width: 34px; height: 34px; border: 4px solid #333; border-top-color: #ffc72c; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { color: #aaa; font-size: 15px; text-align: center; max-width: 560px; line-height: 1.5; white-space: pre-line; }
    #status.error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="logo">S</div>
  <div class="spinner" id="spinner"></div>
  <div id="status">Duke nisur serverin...</div>
  <script>
    // Thirret nga main.js nëse serveri nuk niset.
    window.showError = function (msg) {
      document.getElementById('spinner').style.display = 'none';
      var el = document.getElementById('status');
      el.className = 'error';
      el.textContent = msg;
    };
  </script>
</body>
</html>
